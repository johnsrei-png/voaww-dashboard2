<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Demographics Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:10px;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    font-size:16px;
}

.section{
    margin-top:30px;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:200px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.label{
    color:#666;
    font-size:14px;
}

.value{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

#status{
    margin-top:25px;
    color:#666;
}

</style>

</head>

<body>

<a href="index.html" class="back-link">
← Return to Monthly Dashboard
</a>

<h1>Demographics Dashboard</h1>

<div id="month"></div>

<div class="section">

<h2>Age Groups</h2>

<div class="grid">

<div class="card">
<div class="label">1-12</div>
<div id="age1to12" class="value"></div>
</div>

<div class="card">
<div class="label">13-17</div>
<div id="age13to17" class="value"></div>
</div>

<div class="card">
<div class="label">18-25</div>
<div id="age18to25" class="value"></div>
</div>

<div class="card">
<div class="label">26-29</div>
<div id="age26to29" class="value"></div>
</div>

<div class="card">
<div class="label">30-39</div>
<div id="age30to39" class="value"></div>
</div>

<div class="card">
<div class="label">40-49</div>
<div id="age40to49" class="value"></div>
</div>

<div class="card">
<div class="label">50-59</div>
<div id="age50to59" class="value"></div>
</div>

<div class="card">
<div class="label">60-65</div>
<div id="age60to65" class="value"></div>
</div>

<div class="card">
<div class="label">66+</div>
<div id="age66plus" class="value"></div>
</div>

<div class="card">
<div class="label">Unknown</div>
<div id="ageUnknown" class="value"></div>
</div>

</div>

</div>

<div class="section">

<h2>Gender</h2>

<div class="grid">

<div class="card">
<div class="label">Male</div>
<div id="male" class="value"></div>
</div>

<div class="card">
<div class="label">Female</div>
<div id="female" class="value"></div>
</div>

<div class="card">
<div class="label">Transgender</div>
<div id="transgender" class="value"></div>
</div>

<div class="card">
<div class="label">Unknown</div>
<div id="genderUnknown" class="value"></div>
</div>

</div>

</div>

<div class="section">

<h2>Race</h2>

<div class="grid">

<div class="card">
<div class="label">White</div>
<div id="white" class="value"></div>
</div>

<div class="card">
<div class="label">Black</div>
<div id="black" class="value"></div>
</div>

<div class="card">
<div class="label">American Indian</div>
<div id="americanIndian" class="value"></div>
</div>

<div class="card">
<div class="label">Other</div>
<div id="otherRace" class="value"></div>
</div>

<div class="card">
<div class="label">Unknown</div>
<div id="raceUnknown" class="value"></div>
</div>

</div>

</div>

<div class="section">

<h2>Ethnicity</h2>

<div class="grid">

<div class="card">
<div class="label">Hispanic</div>
<div id="hispanic" class="value"></div>
</div>

<div class="card">
<div class="label">Non-Hispanic</div>
<div id="nonHispanic" class="value"></div>
</div>

<div class="card">
<div class="label">Unknown</div>
<div id="ethnicityUnknown" class="value"></div>
</div>

</div>

</div>

<div id="status">
Loading...
</div>

<script>

async function loadData(){

    try{

        const response =
            await fetch(
                '/data/demographicsData.json'
            );

        const records =
            await response.json();

        const d = records[0];

        document.getElementById('month')
            .innerText =
            d.month;

        Object.keys(d).forEach(key => {

            const element =
                document.getElementById(key);

            if(element){

                element.innerText =
                    d[key];

            }

        });

        document.getElementById(
            'status'
        ).innerText =
        'Loaded demographics data';

    }

    catch(error){

        document.getElementById(
            'status'
        ).innerText =
        error.toString();

    }

}

loadData();

</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOAWW Demographics Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.label{
    color:#666;
}

.value{
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
}

.section{
    margin-top:30px;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
}

#status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<body>

<a class="back-link" href="index.html">
← Monthly Dashboard
</a>

<h1>Demographics Dashboard</h1>

<div class="section">

<h2>Age Groups</h2>

<div class="card-container">

<div class="card">
<div class="label">18-25</div>
<div id="age18to25" class="value">-</div>
</div>

<div class="card">
<div class="label">26-29</div>
<div id="age26to29" class="value">-</div>
</div>

<div class="card">
<div class="label">30-39</div>
<div id="age30to39" class="value">-</div>
</div>

<div class="card">
<div class="label">40-49</div>
<div id="age40to49" class="value">-</div>
</div>

</div>

</div>

<div class="section">

<h2>Gender</h2>

<div class="card-container">

<div class="card">
<div class="label">Male</div>
<div id="male" class="value">-</div>
</div>

<div class="card">
<div class="label">Female</div>
<div id="female" class="value">-</div>
</div>

<div class="card">
<div class="label">Unknown</div>
<div id="unknownGender" class="value">-</div>
</div>

</div>

</div>

<div id="status">
Loading...
</div>

<script>

async function loadData(){

    try{

        const response =
            await fetch(
                '/data/demographicsData.json'
            );

        const data =
            await response.json();

        const demo =
            data[0];

        document.getElementById(
            'age18to25'
        ).innerText =
        demo.age18to25;

        document.getElementById(
            'age26to29'
        ).innerText =
        demo.age26to29;

        document.getElementById(
            'age30to39'
        ).innerText =
        demo.age30to39;

        document.getElementById(
            'age40to49'
        ).innerText =
        demo.age40to49;

        document.getElementById(
            'male'
        ).innerText =
        demo.male;

        document.getElementById(
            'female'
        ).innerText =
        demo.female;

        document.getElementById(
            'unknownGender'
        ).innerText =
        demo.unknownGender;

        document.getElementById(
            'status'
        ).innerText =
        'Loaded demographics data';

    }

    catch(error){

        document.getElementById(
            'status'
        ).innerText =
        error.toString();

    }

}

loadData();

</script>

</body>

</html>

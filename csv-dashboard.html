<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOAWW CSV Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.label{
    color:#666;
}

.value{
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
}

select,
input[type=file]{
    padding:10px;
    margin:10px 0;
}

#status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<body>

<h1>VOAWW CSV Dashboard</h1>

<p>
Upload a CCRS Metrics CSV Export
</p>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<br>

<select id="skillSelector">
    <option>Select Skill</option>
</select>

<div class="card-container">

<div class="card">
<div class="label">Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Warm Transfers</div>
<div id="warmTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Cold Transfers</div>
<div id="coldTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Average Duration</div>
<div id="averageDuration" class="value">-</div>
</div>

</div>

<div id="status">
No file loaded
</div>

<script>

let allRows = [];

document
.getElementById("fileInput")
.addEventListener(
    "change",
    loadCSV
);

document
.getElementById("skillSelector")
.addEventListener(
    "change",
    function(){

        calculateMetrics(
            this.value
        );

    }
);

function loadCSV(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

        const text =
            e.target.result;

        parseCSV(text);

    };

    reader.readAsText(file);

}

function parseCSV(text){

    const rows =
        text
        .split(/\r?\n/)
        .filter(
            row => row.trim()
        );

    const headers =
        rows[0]
        .split(",");

    allRows =
        rows.slice(1)
        .map(row => {

            const cols =
                row.split(",");

            const obj = {};

            headers.forEach(
                (header,index)=>{

                obj[
                    header.trim()
                ] =
                cols[index]
                ? cols[index].trim()
                : "";

            });

            return obj;

        });

    buildSkillList();

    document
        .getElementById(
            "status"
        )
        .innerText =
        "Loaded "
        + allRows.length
        + " records";

}

function buildSkillList(){

    const selector =
        document.getElementById(
            "skillSelector"
        );

    selector.innerHTML =
        "";

    const skills =
        [
            ...new Set(
                allRows.map(
                    row =>
                    row["Skill Name"]
                )
            )
        ].sort();

    skills.forEach(skill => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            skill;

        option.text =
            skill;

        selector.appendChild(
            option
        );

    });

    if(skills.length > 0){

        selector.value =
            skills[0];

        calculateMetrics(
            skills[0]
        );

    }

}

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW CSV Dashboard V2.2b</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#f5f5f5;
}

input,select{
    padding:10px;
    margin:10px 0;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.label{
    color:#666;
}

.value{
    font-size:36px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#f0f0f0;
}

#status{
    margin-top:20px;
}

</style>
</head>

<body>

<h1>VOAWW CSV Dashboard V2.2b</h1>

<input
type="file"
id="fileInput"
accept=".csv">

<br>

<select id="skillSelector">
<option>Upload CSV First</option>
</select>

<div class="cards">

<div class="card">
<div class="label">Total Records</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Skill Name</div>
<div id="selectedSkill" class="value">-</div>
</div>

</div>

<div id="status">
Waiting for file...
</div>

<h2>Sample Records</h2>

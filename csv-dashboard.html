<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSV Reader Test</title>
</head>

<body>

<h1>CSV Reader Test</h1>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<div id="status">
Waiting for file...
</div>

<pre id="output"></pre>

<script>

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(event){

            const file =
                event.target.files[0];

            if(!file){
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const text =
                        e.target.result;

                    const rows =
                        text
                        .split(/\r?\n/)
                        .filter(
                            row => row.trim()
                        );

                    document
                        .getElementById(
                            "status"
                        )
                        .innerText =
                        "Rows found: "
                        + rows.length;

                    document
                        .getElementById(
                            "output"
                        )
                        .innerText =
                        rows
                            .slice(0,5)
                            .join("\n");

                };

            reader.readAsText(
                file
            );

        }
    );

</script>

</body>
</html>

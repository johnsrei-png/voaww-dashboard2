<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSV Upload Test</title>
</head>

<body>

<h1>CSV Upload Test</h1>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<div id="status">
Waiting for file...
</div>

<script>

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(event){

            document
                .getElementById(
                    "status"
                )
                .innerText =
                "FILE SELECTED";

            console.log(
                "File Selected"
            );

            const file =
                event.target.files[0];

            if(file){

                document
                    .getElementById(
                        "status"
                    )
                    .innerText =
                    "Selected: "
                    + file.name;

            }

        }
    );

</script>

</body>
</html>

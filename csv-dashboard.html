<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW CSV Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#f5f5f5;
}

select,
input{
    padding:10px;
    margin:10px 0;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.value{
    font-size:36px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>VOAWW CSV Dashboard</h1>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<br>

<select id="skillSelector">
    <option>Upload CSV First</option>
</select>

<div class="card">

<h3>Calls For Selected Skill</h3>

<div
    id="rowCount"
    class="value">
-
</div>

</div>

<div id="status">
Waiting for file...
</div>

<script>

let allRows = [];

document
.getElementById("fileInput")
.addEventListener(
    "change",
    loadCsv
);

document
.getElementById("skillSelector")
.addEventListener(
    "change",
    function(){

        countRows(
            this.value
        );

    }
);

function loadCsv(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            const text =
                e.target.result;

            const lines =
                text
                .split(/\r?\n/)
                .filter(
                    line =>
                    line.trim()
                );

            allRows =
                lines.slice(1);

            buildSkills();

        };

    reader.readAsText(file);

}

function buildSkills(){

    const skills =
        new Set();

    allRows.forEach(line => {

        const firstComma =
            line.indexOf(",");

        if(firstComma > -1){

            const skill =
                line
                .substring(
                    0,
                    firstComma
                )
                .trim();

            if(skill){

                skills.add(
                    skill
                );

            }

        }

    });

    const selector =
        document.getElementById(
            "skillSelector"
        );

    selector.innerHTML = "";

    [...skills]
        .sort()
        .forEach(skill => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            skill;

        option.text =
            skill;

        selector.appendChild(
            option
        );

    });

    document
        .getElementById(
            "status"
        )
        .innerText =
        "Skills detected: "
        + skills.size;

    if(skills.size > 0){

        const firstSkill =
            [...skills][0];

        selector.value =
            firstSkill;

        countRows(
            firstSkill
        );

    }

}

function countRows(skill){

    const count =
        allRows.filter(
            row =>
            row.startsWith(
                skill + ","
            )
        ).length;

    document
        .getElementById(
            "rowCount"
        )
        .innerText =
        count
        .toLocaleString();

}

</script>

</body>
</html>

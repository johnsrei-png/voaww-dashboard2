<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>VOAWW CSV Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

select,
input{
    padding:10px;
    margin:10px 0;
    font-size:16px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.label{
    color:#666;
}

.value{
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
}

#status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<body>

<h1>VOAWW CSV Dashboard V2.2b</h1>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<br>

<select id="skillSelector">
    <option>Upload CSV First</option>
</select>

<div class="cards">

<div class="card">
<div class="label">Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Warm Transfers</div>
<div id="warmTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Cold Transfers</div>
<div id="coldTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Average Duration</div>
<div id="avgDuration" class="value">-</div>
</div>

</div>

<div id="status">
Waiting for file...
</div>

<script>

let headers = [];
let rows = [];

document
.getElementById("fileInput")
.addEventListener(
    "change",
    loadCsv
);

document
.getElementById("skillSelector")
.addEventListener(
    "change",
    function(){

        calculateMetrics(
            this.value
        );

    }
);

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Skill Detection Test</title>
</head>

<body>

<h1>Skill Detection Test</h1>

<input
    type="file"
    id="fileInput"
    accept=".csv">

<div id="status">
Waiting for file...
</div>

<pre id="output"></pre>

<script>

document
.getElementById("fileInput")
.addEventListener(
    "change",
    loadCSV
);

function loadCSV(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            const text =
                e.target.result;

            const rows =
                text
                .split(/\r?\n/)
                .filter(
                    row => row.trim()
                );

            const headers =
                rows[0]
                .split(",");

            const cleanedHeaders =
                headers.map(
                    h =>
                    h.replace(/^\uFEFF/, "")
                     .trim()
                );

            document
                .getElementById(
                    "output"
                )
                .innerText =
                cleanedHeaders.join("\n");

            const skillIndex =
                cleanedHeaders.findIndex(
                    h =>
                    h === "Skill Name"
                );

            document
                .getElementById(
                    "status"
                )
                .innerText =
                "Skill Name column index: "
                + skillIndex;

        };

    reader.readAsText(file);

}

</script>

</body>
</html>

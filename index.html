<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#0f4c81;
    color:white;
    padding:20px;
}

.header h1{
    margin:0;
}

.nav{
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
}

.nav button{
    padding:15px 20px;
    border:none;
    background:white;
    cursor:pointer;
    font-size:16px;
}

.nav button.active{
    background:#0f4c81;
    color:white;
}

.page{
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.value{
    font-size:32px;
    font-weight:bold;
}

.placeholder{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

select{
    padding:10px;
    margin-bottom:20px;
    font-size:16px;
}

#status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

    <h1>VOAWW Dashboard V2</h1>
</div>

</button>

</button>

<button

DOC Calls
</button>

<button
id="settingsBtn"

Settings
</button>

</div>

<div id="monthlyPage">

<div class="card">
    <h3>Answered Calls</h3>
    <div id="answeredCalls" class="value"></div>
</div>

<div class="card">
    <h3>Missed Calls</h3>
    <div id="missedCalls" class="value"></div>
</div>

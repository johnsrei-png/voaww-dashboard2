<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VOAWW Dashboard V2</title>

    https://cdn.jsdelivr.net/npm/chart.jsscript>

</head>

<style>
body{
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f5f5f5;
}

.card-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    min-width:220px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.value{
    font-size:36px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<select id="monthSelector"></select>

<div class="card-container">

<div class="card">
    <div>Total Calls</div>
    <div id="totalCalls" class="value">-</div>
</div>

<div class="card">
    <div>Answered Calls</div>
    <div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
    <div>Missed Calls</div>
    <div id="missedCalls" class="value">-</div>
</div>

<div class="card">
    <div>Answer Rate</div>
    <div id="answerRate" class="value">-</div>
</div>

</div>

<script>

const dashboardData = [
    {
        month:"July 2026",
        totalCalls:2400,
        answeredCalls:2350,
        missedCalls:50
    },
    {
        month:"August 2026",
        totalCalls:2540,
        answeredCalls:2480,
        missedCalls:60
    },
    {
        month:"September 2026",
        totalCalls:2620,
        answeredCalls:2580,
        missedCalls:40
    }
];

function render(record){

    document.getElementById("totalCalls").innerText =
        record.totalCalls.toLocaleString();

    document.getElementById("answeredCalls").innerText =
        record.answeredCalls.toLocaleString();

    document.getElementById("missedCalls").innerText =
        record.missedCalls.toLocaleString();

    const rate =
        (record.answeredCalls /
        record.totalCalls) * 100;

    document.getElementById("answerRate").innerText =
        rate.toFixed(1) + "%";
}

const selector =
    document.getElementById("monthSelector");

dashboardData.forEach((item,index)=>{

    const option =
        document.createElement("option");

    option.value = index;
    option.text = item.month;

    selector.appendChild(option);

});

selector.addEventListener("change", function(){

    const record =
        dashboardData[
            Number(this.value)
        ];

    render(record);

});

selector.value =
    dashboardData.length - 1;

render(
    dashboardData[
        dashboardData.length - 1
    ]
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f5f7;
    margin:0;
    padding:40px;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:20px;
}

select{
    padding:10px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:30px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:white;
    border-radius:12px;
    padding:24px;
    min-width:220px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.label{
    color:#666;
    font-size:14px;
}

.value{
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

.chart-card{
    background:white;
    border-radius:12px;
    padding:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

canvas{
    width:100%;
    max-width:900px;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<div class="subtitle">
Monthly Reporting Dashboard
</div>

<select id="monthSelector"></select>

<div class="card-container">

    <div class="card">
        <div class="label">Total Calls</div>
        <div id="totalCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Answered Calls</div>
        <div id="answeredCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Missed Calls</div>
        <div id="missedCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Answer Rate</div>
        <div id="answerRate" class="value">-</div>
    </div>

</div>

<div class="chart-card">

    <h2>Monthly Call Trend</h2>

    <canvas
        id="trendChart"
        width="900"
        height="300">
    </canvas>

</div>

<script>

let dashboardData = [];

async function loadData(){

    const response =
        await fetch('./data/monthlyData.csv');

    const csv =
        await response.text();

    const rows =
        csv.trim().split('\n');

    dashboardData =
        rows.slice(1).map(row => {

            const cols =
                row.split(',');

            return {

                month: cols[0],
                year: cols[1],

                totalCalls:
                    Number(cols[2]),

                answeredCalls:
                    Number(cols[3]),

                missedCalls:
                    Number(cols[4])

            };

        });

    buildDropdown();

    drawChart(dashboardData);

    renderDashboard(
        dashboardData[
            dashboardData.length - 1
        ]
    );

}

function buildDropdown(){

    const dropdown =
        document.getElementById(
            "monthSelector"
        );

    dashboardData.forEach(
        (record,index)=>{

        const option =
            document.createElement(
                "option"
            );

        option.value = index;

        option.text =
            record.month +
            " " +
            record.year;

        dropdown.appendChild(option);

    });

    dropdown.value =
        dashboardData.length - 1;

    dropdown.addEventListener(
        "change",
        e => {

            const selected =
                dashboardData[
                    Number(
                        e.target.value
                    )
                ];

            renderDashboard(
                selected
            );

        }
    );

}

function renderDashboard(record){

    document.getElementById(
        "totalCalls"
    ).innerText =
    record.totalCalls
        .toLocaleString();

    document.getElementById(
        "answeredCalls"
    ).innerText =
    record.answeredCalls
        .toLocaleString();

    document.getElementById(
        "missedCalls"
    ).innerText =
    record.missedCalls
        .toLocaleString();

    const answerRate =
        (
            record.answeredCalls /
            record.totalCalls
        ) * 100;

    document.getElementById(
        "answerRate"
    ).innerText =
    answerRate.toFixed(1)
    + "%";

}

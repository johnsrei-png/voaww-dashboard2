<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.card{
    background:white;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.value{
    font-size:32px;
    font-weight:bold;
}

.dashboard-link{
    display:inline-block;
    margin-bottom:20px;
    font-size:16px;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<p>
    <a
        class="dashboard-link"
        href="demographics.html">
        Open Demographics Dashboard →
    </a>
</p>

<select id="monthSelector"></select>

<div class="card">
    <h3>Total Calls</h3>
    <div id="totalCalls" class="value"></div>
</div>

<div class="card">
    <h3>Answered Calls</h3>
    <div id="answeredCalls" class="value"></div>
</div>

<div class="card">
    <h3>Missed Calls</h3>
    <div id="missedCalls" class="value"></div>
</div>

<div class="card">
    <h3>Warm Transfers</h3>
    <div id="warmTransfers" class="value"></div>
</div>

<div class="card">
    <h3>Cold Transfers</h3>
    <div id="coldTransfers" class="value"></div>
</div>

<div class="card">
    <h3>Average Call Duration</h3>
    <div id="averageCallDuration" class="value"></div>
</div>

<div id="status"></div>

<script>

let monthlyData = [];

async function loadDashboard() {

    const response =
        await fetch('/data/monthlyData.json');

    monthlyData =
        await response.json();

    document.getElementById(
        'status'
    ).innerText =
        'Loaded ' +
        monthlyData.length +
        ' months';

    const selector =
        document.getElementById(
            'monthSelector'
        );

    selector.innerHTML = '';

    monthlyData.forEach((month,index)=>{

        const option =
            document.createElement(
                'option'
            );

        option.value = index;

        option.text =
            month.month;

        selector.appendChild(
            option
        );

    });

    selector.value =
        monthlyData.length - 1;

    selector.addEventListener(
        'change',
        function(){

            showMonth(
                monthlyData[
                    Number(
                        this.value
                    )
                ]
            );

        }
    );

    showMonth(
        monthlyData[
            monthlyData.length - 1
        ]
    );

}

function showMonth(month){

    document.getElementById(
        'totalCalls'
    ).innerText =
        month.totalCalls;

    document.getElementById(
        'answeredCalls'
    ).innerText =
        month.answeredCalls;

    document.getElementById(
        'missedCalls'
    ).innerText =
        month.missedCalls;

    document.getElementById(
        'warmTransfers'
    ).innerText =
        month.warmTransfers;

    document.getElementById(
        'coldTransfers'
    ).innerText =
        month.coldTransfers;

    document.getElementById(
        'averageCallDuration'
    ).innerText =
        month.averageCallDuration;

}

loadDashboard();

</script>

</body>
</html>

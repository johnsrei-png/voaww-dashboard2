<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

select{
    padding:10px;
    margin-bottom:20px;
    font-size:16px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    min-width:220px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.label{
    color:#666;
}

.value{
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
}

#status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<select id="monthSelector"></select>

<div class="cards">

<div class="card">
<div class="label">Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div class="label">Answer Rate</div>
<div id="answerRate" class="value">-</div>
</div>

<div class="card">
<div class="label">Warm Transfers</div>
<div id="warmTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Cold Transfers</div>
<div id="coldTransfers" class="value">-</div>
</div>

<div class="card">
<div class="label">Avg Duration</div>
<div id="averageDuration" class="value">-</div>
</div>

</div>

<div id="status">
Loading...
</div>

<script>

let data = [];

async function start() {

    try {

        const response =
            await fetch('/data/monthlyData.json');

        data =
            await response.json();

        buildDropdown();

        showMonth(
            data[data.length - 1]
        );

        document.getElementById(
            "status"
        ).innerText =
        "Loaded " +
        data.length +
        " months";

    }

    catch(error){

        document.getElementById(
            "status"
        ).innerText =
        error.toString();

        console.error(error);

    }

}

function buildDropdown(){

    const selector =
        document.getElementById(
            "monthSelector"
        );

    selector.innerHTML = "";

    data.forEach(
        (item,index)=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                index;

            option.text =
                item.month;

            selector.appendChild(
                option
            );

        });

    selector.value =
        data.length - 1;

    selector.addEventListener(
        "change",
        function(){

            const month =
                data[
                    Number(
                        this.value
                    )
                ];

            showMonth(month);

        });

}

function showMonth(month){

    document.getElementById(
        "totalCalls"
    ).innerText =
    month.totalCalls;

    document.getElementById(
        "answeredCalls"
    ).innerText =
    month.answeredCalls;

    document.getElementById(
        "missedCalls"
    ).innerText =
    month.missedCalls;

    document.getElementById(
        "warmTransfers"
    ).innerText =
    month.warmTransfers;

    document.getElementById(
        "coldTransfers"
    ).innerText =
    month.coldTransfers;

    document.getElementById(
        "averageDuration"
    ).innerText =
    month.averageCallDuration;

    const answerRate =
        (
            month.answeredCalls /
            month.totalCalls
        ) * 100;

    document.getElementById(
        "answerRate"
    ).innerText =
    answerRate.toFixed(1)
    + "%";

}

start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

select{
    padding:8px;
    margin-bottom:20px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.value{
    font-size:36px;
    font-weight:bold;
}

.chart-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#chartArea{
    display:flex;
    align-items:flex-end;
    gap:20px;
    height:250px;
    margin-top:20px;
}

.bar-column{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.bar{
    width:60px;
    background:#2563eb;
    border-radius:6px 6px 0 0;
}

.bar-label{
    margin-top:10px;
    font-size:14px;
}

.status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<select id="monthSelector"></select>

<div class="card-container">

<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div>Answered Calls</div>

</div>

<div class="card">

</div>

<div class="card">

</div>

</div>

<div class="chart-box">

<h2>Monthly Call Trend</h2>

<div id="chartArea"></div>

</div>

<div id="status" class="status">
Loading data...
</div>

        console.error(error);

        document.getElementById("status")
            .innerText =
            "Failed to load monthlyData.json";

    }

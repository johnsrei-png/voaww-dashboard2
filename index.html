<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Debug</title>
</head>
<body>

<h1>VOAWW Debug</h1>

<div id="output">Loading...</div>

<script>

async function test() {

    const response =
        await fetch('/data/monthlyData.json');

    const data =
        await response.json();

    console.log(data);

    document.getElementById("output").innerHTML =
        "<pre>" +
        JSON.stringify(
            data,
            null,
            2
        ) +
        "</pre>";

}

test();

</script>

</body>
</html>

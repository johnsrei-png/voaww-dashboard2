<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Dashboard Debug</title>
</head>
<body>

<h1>VOAWW Dashboard Debug</h1>

<h2>Status</h2>
<div id="status">Starting...</div>

<h2>Raw Data</h2>
<pre id="data"></pre>

<script>

async function start() {

    try {

        document.getElementById("status").innerText =
            "Fetching JSON...";

        const response =
            await fetch('/data/monthlyData.json');

        document.getElementById("status").innerText =
            "Response status: " + response.status;

        const text =
            await response.text();

        document.getElementById("data").innerText =
            text;

    }

    catch(error) {

        document.getElementById("status").innerText =
            "ERROR: " + error.message;

        console.error(error);

    }

}

start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f5f7;
    margin:0;
    padding:40px;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:24px;
    min-width:220px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.label{
    color:#666;
    font-size:14px;
}

.value{
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

.loading{
    margin-top:40px;
    color:#666;
}

.error{
    margin-top:40px;
    color:red;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<div id="month" class="subtitle">
Loading...
</div>

<div class="card-container">

    <div class="card">
        <div class="label">Total Calls</div>
        <div id="totalCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Answered Calls</div>
        <div id="answeredCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Missed Calls</div>
        <div id="missedCalls" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Answer Rate</div>
        <div id="answerRate" class="value">-</div>
    </div>

</div>

<div id="status" class="loading">
Loading monthly data...
</div>

<script>

async function loadData() {

    try {

        const response =
            await fetch('./data/monthlyData.csv');

        const csv =
            await response.text();

        const rows =
            csv.trim().split('\n');

        const data =
            rows.slice(1).map(row => {

                const cols =
                    row.split(',');

                return {

                    month: cols[0],

                    year: cols[1],

                    totalCalls:
                        Number(cols[2]),

                    answeredCalls:
                        Number(cols[3]),

                    missedCalls:
                        Number(cols[4])

                };
            });

        const latest =
            data[data.length - 1];

        renderDashboard(latest);

    }

    catch(error){

        document.getElementById("status")
            .innerHTML =
            "Unable to load monthlyData.csv";

        console.error(error);

    }

}

function renderDashboard(monthlyData){

    document.getElementById("month")
        .innerText =
        monthlyData.month + " " +
        monthlyData.year;

    document.getElementById("totalCalls")
        .innerText =
        monthlyData.totalCalls
        .toLocaleString();

    document.getElementById("answeredCalls")
        .innerText =
        monthlyData.answeredCalls
        .toLocaleString();

    document.getElementById("missedCalls")
        .innerText =
        monthlyData.missedCalls
        .toLocaleString();

    const answerRate =
        (
            monthlyData.answeredCalls /
            monthlyData.totalCalls
        ) * 100;

    document.getElementById("answerRate")
        .innerText =
        answerRate.toFixed(1) + "%";

    document.getElementById("status")
        .innerHTML =
        "Data loaded successfully";

}

loadData();

</script>

</body>
</html>

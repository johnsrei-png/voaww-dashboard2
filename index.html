<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Dashboard V2 Debug</title>
</head>
<body>

<h1>JSON Debug</h1>

<div id="output">Loading...</div>

<script>

async function test() {

    try {

        const response =
            await fetch('./data/monthlyData.json');

        const text =
            await response.text();

        document.getElementById(
            'output'
        ).innerHTML =
            '<h2>Raw File Contents</h2><pre>' +
            text +
            '</pre>';

        console.log(text);

    }

    catch(error) {

        document.getElementById(
            'output'
        ).innerText =
            error.toString();

        console.error(error);

    }

}

test();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.card{
    background:white;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.value{
    font-size:32px;
    font-weight:bold;
}

#status{
    margin-top:20px;
    color:#666;
}

#preview{
    margin-top:20px;
    white-space:pre-wrap;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<h2>Upload Monthly CSV Report</h2>

<input
    type="file"
    id="csvFile"
    accept=".csv">

<div id="status">
No file loaded
</div>

<div id="preview">
Upload a CSV file to begin.
</div>

<script>

document
    .getElementById("csvFile")
    .addEventListener(
        "change",
        loadCsv
    );

function loadCsv(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

        const text =
            e.target.result;

        const rows =
            text.split(/\r?\n/)
                .filter(
                    row => row.trim()
                );

        if(rows.length === 0){

            document
                .getElementById(
                    "status"
                )
                .innerText =
                "File appears empty";

            return;
        }

        const headers =
            rows[0]
            .split(",");

        document
            .getElementById(
                "status"
            )
            .innerText =
            "Loaded "
            + rows.length +
            " rows";

        document
            .getElementById(
                "preview"
            )
            .innerText =
            "HEADERS FOUND:\n\n" +
            headers.join("\n");

        console.log(
            "HEADERS",
            headers
        );

    };

    reader.readAsText(file);

}

</script>

</body>
</html>

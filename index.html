<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>VOAWW Dashboard V2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18min.jsscript>

<style>

body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#f5f5f5;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.value{
    font-size:36px;
    font-weight:bold;
}

#chartArea{
    display:flex;
    align-items:flex-end;
    gap:20px;
    height:250px;
    margin-top:20px;
}

.bar-column{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.bar{
    width:60px;
    background:#2563eb;
    border-radius:6px 6px 0 0;
}

.bar-label{
    margin-top:10px;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<p>
Upload an Excel file:
</p>

<input
    type="file"
    id="fileInput"
    accept=".xlsx">

<br><br>

<select id="monthSelector"></select>

<div class="card-container">

<div class="card">
<div>Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div>Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div>Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div>Answer Rate</div>
<div id="answerRate" class="value">-</div>
</div>

</div>

<h2>Monthly Trend</h2>

<div id="chartArea"></div>

<script>

let dashboardData=[];

document
.getElementById("fileInput")
.addEventListener(
"change",
loadExcel
);

function loadExcel(event){

const file =
event.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload = function(e){

const data =
new Uint8Array(
e.target.result
);

const workbook =
XLSX.read(
data,
{type:"array"}
);

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

dashboardData =
XLSX.utils.sheet_to_json(
sheet
);

initializeDashboard();

};

reader.readAsArrayBuffer(
file
);

}

function initializeDashboard(){

buildDropdown();

renderDashboard(
dashboardData[
dashboardData.length-1
]
);

buildChart();

}

function buildDropdown(){

const selector =
document.getElementById(
"monthSelector"
);

selector.innerHTML="";

dashboardData.forEach(
(record,index)=>{

const option =
document.createElement(
"option"
);

option.value=index;

option.text=
record.month;

selector.appendChild(
option
);

});

selector.value=
dashboardData.length-1;

selector.onchange=
function(){

renderDashboard(
dashboardData[
Number(
this.value
)
]
);

};

}

function renderDashboard(record){

document.getElementById(
"totalCalls"
).innerText=
Number(
record.totalCalls
).toLocaleString();

document.getElementById(
"answeredCalls"
).innerText=
Number(
record.answeredCalls
).toLocaleString();

document.getElementById(
"missedCalls"
).innerText=
Number(
record.missedCalls
).toLocaleString();

const answerRate=
(
record.answeredCalls/
record.totalCalls
)*100;

document.getElementById(
"answerRate"
).innerText=
answerRate.toFixed(1)
+"%";

}

function buildChart(){

const chart=
document.getElementById(
"chartArea"
);

chart.innerHTML="";

const max=
Math.max(
...dashboardData.map(
x=>Number(
x.totalCalls
)
)
);

dashboardData.forEach(
record=>{

const column=
document.createElement(
"div"
);

column.className=
"bar-column";

const value=
document.createElement(
"div"
);

value.innerText=
record.totalCalls;

const bar=
document.createElement(
"div"
);

bar.className=
"bar";

bar.style.height=
(
record.totalCalls/
max
)*180
+"px";

const label=
document.createElement(
"div"
);

label.className=
"bar-label";

label.innerText=
record.month;

column.appendChild(
value
);

column.appendChild(
bar
);

column.appendChild(
label
);

chart.appendChild(
column
);

});

}

</script>

</body>

</html>

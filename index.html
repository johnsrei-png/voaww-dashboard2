<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

select{
    padding:8px;
    margin-bottom:20px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.value{
    font-size:36px;
    font-weight:bold;
}

.chart-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#chartArea{
    display:flex;
    align-items:flex-end;
    gap:20px;
    height:250px;
    margin-top:20px;
}

.bar-column{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.bar{
    width:60px;
    background:#2563eb;
    border-radius:6px 6px 0 0;
}

.bar-label{
    margin-top:10px;
    font-size:14px;
}

.status{
    margin-top:20px;
    color:#666;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<select id="monthSelector"></select>

<div class="card-container">

<div class="card">
<div>Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div>Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div>Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div>Answer Rate</div>
<div id="answerRate" class="value">-</div>
</div>

</div>

<div class="chart-box">

<h2>Monthly Call Trend</h2>

<div id="chartArea"></div>

</div>

<div id="status" class="status">
Loading...
</div>

<script>

let dashboardData = [];

async function startDashboard() {

    try {

        const response =
            await fetch('/data/monthlyData.json');

        dashboardData =
            await response.json();

        buildDropdown();

        renderDashboard(
            dashboardData[
                dashboardData.length - 1
            ]
        );

        buildChart();

        document.getElementById(
            "status"
        ).innerText =
        "Loaded "
        + dashboardData.length
        + " months";

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
        "ERROR: "
        + error.message;

    }

}

function buildDropdown(){

    const selector =
        document.getElementById(
            "monthSelector"
        );

    selector.innerHTML = "";

    dashboardData.forEach(
        (record,index)=>{

        const option =
            document.createElement(
                "option"
            );

        option.value =
            index;

        option.text =
            record.month;

        selector.appendChild(
            option
        );

    });

    selector.value =
        dashboardData.length - 1;

    selector.onchange =
        function(){

        renderDashboard(
            dashboardData[
                Number(
                    this.value
                )
            ]
        );

    };

}

function renderDashboard(record){

    document.getElementById(
        "totalCalls"
    ).innerText =
    record.totalCalls
        .toLocaleString();

    document.getElementById(
        "answeredCalls"
    ).innerText =
    record.answeredCalls
        .toLocaleString();

    document.getElementById(
        "missedCalls"
    ).innerText =
    record.missedCalls
        .toLocaleString();

    const answerRate =
        (
            record.answeredCalls /
            record.totalCalls
        ) * 100;

    document.getElementById(
        "answerRate"
    ).innerText =
    answerRate.toFixed(1)
    + "%";

}

function buildChart(){

    const chart =
        document.getElementById(
            "chartArea"
        );

    chart.innerHTML = "";

    const max =
        Math.max(
            ...dashboardData.map(
                x => x.totalCalls
            )
        );

    dashboardData.forEach(
        record => {

        const column =
            document.createElement(
                "div"
            );

        column.className =
            "bar-column";

        const value =
            document.createElement(
                "div"
            );

        value.innerText =
            record.totalCalls;

        const bar =
            document.createElement(
                "div"
            );

        bar.className =
            "bar";

        bar.style.height =
            (
                record.totalCalls
                / max
            ) * 180
            + "px";

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "bar-label";

        label.innerText =
            record.month.split(
                " "
            )[0];

        column.appendChild(
            value
        );

        column.appendChild(
            bar
        );

        column.appendChild(
            label
        );

        chart.appendChild(
            column
        );

    });

}

startDashboard();

</script>

</body>
</html>

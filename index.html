<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Test</title>
</head>
<body>

<h1>Dashboard Test</h1>

<div id="status">Starting...</div>

<pre id="output"></pre>

<script>

async function test() {

  try {

    const response =
      await fetch('/data/monthlyData.json');

    const data =
      await response.json();

    document.getElementById(
      'status'
    ).innerText =
      'SUCCESS';

    document.getElementById(
      'output'
    ).innerText =
      JSON.stringify(
        data,
        null,
        2
      );

  }
  catch(error) {

    document.getElementById(
      'status'
    ).innerText =
      error.toString();

  }

}

test();

</script>

</body>
</html>

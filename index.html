<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOAWW Dashboard V2</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    margin-bottom:20px;
}

select{
    padding:8px;
    margin-bottom:20px;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    min-width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.value{
    font-size:36px;
    font-weight:bold;
}

.chart-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#chartArea{
    display:flex;
    align-items:flex-end;
    gap:20px;
    height:250px;
    margin-top:20px;
}

.bar-column{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.bar{
    width:60px;
    background:#2563eb;
    border-radius:6px 6px 0 0;
}

.bar-label{
    margin-top:10px;
    font-size:14px;
}

</style>

</head>

<body>

<h1>VOAWW Dashboard V2</h1>

<select id="monthSelector"></select>

<div class="card-container">

<div class="card">
<div>Total Calls</div>
<div id="totalCalls" class="value">-</div>
</div>

<div class="card">
<div>Answered Calls</div>
<div id="answeredCalls" class="value">-</div>
</div>

<div class="card">
<div>Missed Calls</div>
<div id="missedCalls" class="value">-</div>
</div>

<div class="card">
<div>Answer Rate</div>
<div id="answerRate" class="value">-</div>
</div>

</div>

<div class="chart-box">

<h2>Monthly Call Trend</h2>

<div id="chartArea"></div>

</div>

<script>

const dashboardData = [

{
month:"July 2026",
totalCalls:2400,
answeredCalls:2350,
missedCalls:50
},

{
month:"August 2026",
totalCalls:2540,
answeredCalls:2480,
missedCalls:60
},

{
month:"September 2026",
totalCalls:2620,
answeredCalls:2580,
missedCalls:40
}

];

function render(record){

document.getElementById("totalCalls").innerText =
record.totalCalls.toLocaleString();

document.getElementById("answeredCalls").innerText =
record.answeredCalls.toLocaleString();

document.getElementById("missedCalls").innerText =
record.missedCalls.toLocaleString();

const rate =
(record.answeredCalls /
record.totalCalls) * 100;

document.getElementById("answerRate").innerText =
rate.toFixed(1) + "%";

}

function buildDropdown(){

const selector =
document.getElementById("monthSelector");

dashboardData.forEach((item,index)=>{

const option =
document.createElement("option");

option.value = index;
option.text = item.month;

selector.appendChild(option);

});

selector.value =
dashboardData.length - 1;

selector.addEventListener(
"change",
function(){

render(
dashboardData[
Number(this.value)
]
);

}

);

}

function drawChart(){

const container =
document.getElementById("chartArea");

container.innerHTML = "";

const max =
Math.max(
...dashboardData.map(
d => d.totalCalls
)
);

dashboardData.forEach(record => {

const col =
document.createElement("div");

col.className =
"bar-column";

const bar =
document.createElement("div");

bar.className =
"bar";

bar.style.height =
(record.totalCalls / max)
* 180 + "px";

const value =
document.createElement("div");

value.innerText =
record.totalCalls.toLocaleString();

const label =
document.createElement("div");

label.className =
"bar-label";

label.innerText =
record.month.split(" ")[0];

col.appendChild(value);
col.appendChild(bar);
col.appendChild(label);

container.appendChild(col);

});

}

buildDropdown();

render(
dashboardData[
dashboardData.length - 1
]
);

drawChart();

</script>

</body>
</html>
